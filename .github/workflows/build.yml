name: Build and publish Daily Briefing

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # backup only: GitHub skips most scheduled runs
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Remember which articles were already checked for AI content, and past exclusions
      - uses: actions/cache@v4
        with:
          path: |
            ai_cache.json
            ai_exclusions_log.jsonl
          key: ai-check-${{ github.run_id }}
          restore-keys: ai-check-
      - name: Fetch, cross-check and scan the news
        run: python app.py --build site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Start the next update about 15 minutes from now. GitHub's own schedule is
  # unreliable, so each run triggers the next one. If several runs are active
  # (a push, a backup scheduled run), only the newest carries on, so there is
  # never more than one chain.
  next:
    needs: [build, deploy]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait, then start the next update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 600
          newer=$(gh run list --repo "$REPO" --workflow build.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId > $RUN_ID)] | length")
          if [ "$newer" -gt 0 ]; then
            echo "A newer update is already running, so it will start the next one."
          else
            gh workflow run build.yml --repo "$REPO" --ref main
            echo "Next update started."
          fi
